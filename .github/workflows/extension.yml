name: Test and package extension
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build-extension.mjs
      - run: node --test tests/extension.test.mjs
      - name: Check generated files are reproducible
        run: git diff --exit-code -- extension/data/bundled.js extension/LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: popup-prevention-0.1.0
          path: dist/popup-prevention-0.1.0.zip
