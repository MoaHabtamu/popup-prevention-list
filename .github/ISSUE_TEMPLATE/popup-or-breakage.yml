name: Popup or site breakage
description: Report an ad tab that still opens, or a page this list breaks.
body:
  - type: markdown
    attributes:
      value: Share public URLs and redacted excerpts only. Remove tokens, cookies, IP addresses, and private account details.
  - type: input
    id: page
    attributes:
      label: Public page URL
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and player/server
      description: Include the click that triggers the popup and any selected video server.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Browser and full uBlock Origin versions
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Other blockers and result with this list disabled
  - type: textarea
    id: log
    attributes:
      label: Relevant redacted logger entries
      description: Include popup source, destination hostname/path, and related scriptlet entries. Remove all query tokens and unrelated history.
      render: text
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
